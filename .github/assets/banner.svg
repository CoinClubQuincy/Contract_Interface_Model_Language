<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360" role="img" aria-label="CIML and IML: describe an interface as data, render it anywhere, safely">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#12233a"/></linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#5eead4"/><stop offset="1" stop-color="#60a5fa"/></linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1280" height="360" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="360" rx="16" fill="url(#grid)"/>
  <text x="64" y="136" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="72" font-weight="800" fill="#f8fafc" letter-spacing="-2">CIML <tspan fill="#64748b" font-weight="400">+</tspan> IML</text>
  <rect x="66" y="160" width="96" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="64" y="210" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#e2e8f0">Describe an interface as data.</text>
  <text x="64" y="246" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="27" font-weight="500" fill="#e2e8f0">Render it anywhere, safely.</text>
  <text x="64" y="298" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" fill="#5eead4">ciml/2<tspan fill="#94a3b8"> smart contracts</tspan><tspan fill="#475569">   |   </tspan><tspan fill="#60a5fa">iml/1</tspan><tspan fill="#94a3b8"> HTTP APIs</tspan></text>

  <!-- Document -->
  <g transform="translate(640 54)">
    <rect width="252" height="252" rx="14" fill="#0a0f1c" stroke="#334155"/>
    <circle cx="20" cy="20" r="4.5" fill="#475569"/><circle cx="36" cy="20" r="4.5" fill="#475569"/><circle cx="52" cy="20" r="4.5" fill="#475569"/>
    <text x="236" y="25" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#64748b">token.ciml.json</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14.5">
      <text x="20" y="62" fill="#94a3b8">{</text>
      <text x="36" y="86"><tspan fill="#5eead4">"schema"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">"ciml/2"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="110"><tspan fill="#5eead4">"type"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">"action"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="134"><tspan fill="#5eead4">"binding"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">"token"</tspan><tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="158"><tspan fill="#5eead4">"operation"</tspan><tspan fill="#94a3b8">:</tspan></text>
      <text x="52" y="182" fill="#fde68a">"transfer"<tspan fill="#94a3b8">,</tspan></text>
      <text x="36" y="206"><tspan fill="#5eead4">"effect"</tspan><tspan fill="#94a3b8">: </tspan><tspan fill="#fde68a">"write"</tspan></text>
      <text x="20" y="230" fill="#94a3b8">}</text>
    </g>
  </g>

  <!-- Arrow -->
  <g transform="translate(902 180)">
    <path d="M0 0H46" stroke="#60a5fa" stroke-width="3" stroke-linecap="round"/>
    <path d="M38 -8L48 0L38 8" fill="none" stroke="#60a5fa" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Rendered interface -->
  <g transform="translate(960 54)">
    <rect width="256" height="252" rx="14" fill="#f8fafc"/>
    <text x="22" y="42" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="21" font-weight="700" fill="#0f172a">Send tokens</text>
    <text x="22" y="74" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Recipient</text>
    <rect x="22" y="82" width="212" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="33" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">0xA0b8...eB48</text>
    <text x="22" y="138" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="13" font-weight="600" fill="#475569">Amount</text>
    <rect x="22" y="146" width="212" height="34" rx="7" fill="#fff" stroke="#cbd5e1"/>
    <text x="33" y="168" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13" fill="#64748b">100</text>
    <rect x="22" y="196" width="212" height="38" rx="8" fill="#0f172a"/>
    <text x="128" y="220" text-anchor="middle" font-family="ui-sans-serif, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#f8fafc">Review and send</text>
  </g>
</svg>
